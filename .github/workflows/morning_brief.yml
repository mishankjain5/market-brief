name: Morning Market Brief

on:
  schedule:
    # 7:00 AM IST = 01:30 UTC | runs Mon–Fri only
    - cron: '30 1 * * 1-5'
  workflow_dispatch:   # allows manual trigger from GitHub UI anytime

jobs:
  send-brief:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Market Brief Agent
        env:
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          TAVILY_API_KEY:      ${{ secrets.TAVILY_API_KEY }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          CALLMEBOT_PHONE:     ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY:    ${{ secrets.CALLMEBOT_APIKEY }}
        run: python main.py
